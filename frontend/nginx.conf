server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка документов (PDF/DOCX) идёт через прокси ниже — поднимаем лимит тела с дефолтных 1 МБ.
    client_max_body_size 100m;

    # Встроенный DNS docker (127.0.0.11). Нужен, чтобы proxy_pass с переменной (см. ниже) резолвил
    # имя сервиса n8n ЛЕНИВО в рантайме, а не при старте nginx. Со статическим `proxy_pass http://n8n:…`
    # nginx резолвит upstream при загрузке конфига и падает с "host not found in upstream", если n8n
    # ещё не поднялся (порядок старта / перезапуск n8n), утягивая за собой и раздачу статики.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SPA: client-side routing (react-router). Любой неизвестный путь отдаёт index.html,
    # иначе F5 на /projects/123 вернул бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси на n8n webhook'и. Фронт ходит на свой же origin (/webhook/...), nginx переписывает
    # это на сервис n8n внутри docker-сети — поэтому нет CORS и порт 5678 не зашит в браузерный код.
    # Имя через переменную + $request_uri: ленивый резолв и сохранение исходного пути с query-строкой
    # (/webhook/auth/login?x=y → n8n:5678/webhook/auth/login?x=y).
    location /webhook/ {
        set $n8n_upstream http://n8n:5678;
        proxy_pass $n8n_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Обработка документа асинхронна (фронт поллит job-статус), но upload-вебхук и docling
        # могут отвечать не мгновенно — даём запас по таймауту.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Тестовый префикс n8n (срабатывает, когда воркфлоу открыт в редакторе «Listen for test event»).
    location /webhook-test/ {
        set $n8n_test_upstream http://n8n:5678;
        proxy_pass $n8n_test_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
