[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
markers =
    requires_embeddings: needs embeddings_service on EMBEDDINGS_URL (default http://localhost:8100/embed)
    requires_ollama: needs Ollama on OLLAMA_URL (default http://localhost:11434/api/tags)
    requires_docling: needs docling-serve on DOCLING_URL (default http://localhost:5001/v1/convert/file)
    smoke: minimal auth+upload sanity check
    slow: slow tests (cross-document, large docx)
